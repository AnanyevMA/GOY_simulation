name: Deploy Digital Twin to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    name: Verify Code Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check JS modules
        run: |
          node -c src/config.js
          node -c src/advisor.js
          node -c src/model.js
          node -c src/renderer.js
          node -c src/ui.js
          node -c src/economics.js
          node -c src/app.js

      - name: Verify Physics Engine & Advisor Simulation
        run: |
          node --input-type=module -e "import { state, tick, triggerScenario } from './src/model.js'; for(let i=0; i<60; i++) tick(); if (isNaN(state.out.normalFlow) || state.out.normalFlow <= 0) throw new Error('Invalid flow'); console.log('✓ Physics engine verified: Qn =', Math.round(state.out.normalFlow), 'Nm3/h, HF =', state.out.hfOut.toFixed(3), 'mg/Nm3'); triggerScenario('anode'); for(let i=0; i<10; i++) tick(); console.log('✓ APM Scenario verified: Health =', state.advisor.healthIndex);"

  deploy:
    name: Deploy to Pages
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

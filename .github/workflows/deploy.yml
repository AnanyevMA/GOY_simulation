name: CI and Deploy Digital Twin to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Минимальные права по умолчанию; для публикации Pages они повышаются только в job deploy.
permissions:
  contents: read

jobs:
  test:
    name: Syntax, physics and UI-hint tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}-node${{ matrix.node }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check of all ES modules (src/*.js)
        run: npm run check

      - name: Vendored Chart.js is present
        run: test -s vendor/chart.umd.js

      - name: Tests (physics balances, fuzz, advisor/autopilot, economics, hints, alarms)
        run: npm test

      - name: Smoke - design point and every advisor scenario
        run: |
          node --input-type=module -e "
          import { state, tick, triggerScenario } from './src/model.js';
          for (let i = 0; i < 600; i++) tick();
          const O = state.out;
          if (!Number.isFinite(O.normalFlow) || O.normalFlow < 200000 || O.normalFlow > 240000) throw new Error('Qn out of design range: ' + O.normalFlow);
          console.log('✓ design point: Qn =', Math.round(O.normalFlow), 'Nm3/h, HF =', O.hfOut.toFixed(3), 'mg/Nm3, P =', Math.round(O.fanPowerKW), 'kW');
          for (const name of ['anode_effect', 'winter_frost', 'bag_wear', 'feeder_fault', 'wet_blinding', 'air_drop']) {
            triggerScenario(name);
            if (state.advisor.activeScenario !== name) throw new Error('scenario not started: ' + name);
            for (let i = 0; i < 200; i++) tick();
            if (!Number.isFinite(state.out.hfOut) || !Number.isFinite(state.advisor.healthIndex)) throw new Error('NaN after scenario ' + name);
            console.log('✓ scenario', name, '→ health =', state.advisor.healthIndex, ', HF =', state.out.hfOut.toFixed(2));
          }"

  deploy:
    name: Deploy to Pages
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assemble static site (only what the browser needs)
        run: |
          mkdir -p _site
          cp -r index.html src vendor _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
